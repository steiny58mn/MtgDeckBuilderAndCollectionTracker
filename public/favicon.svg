<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="manaSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8ff" />
      <stop offset="50%" stop-color="#f0abfc" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Subtle MTG Planeswalker 5-Color Mana Sparks (Background Glows) -->
  <circle cx="32" cy="12" r="2.5" fill="#fef08a" opacity="0.9" /> <!-- White/Sun -->
  <circle cx="48" cy="24" r="2.2" fill="#38bdf8" opacity="0.9" /> <!-- Blue/Island -->
  <circle cx="43" cy="48" r="2.2" fill="#c084fc" opacity="0.9" /> <!-- Black/Swamp -->
  <circle cx="21" cy="48" r="2.2" fill="#f87171" opacity="0.9" /> <!-- Red/Mountain -->
  <circle cx="16" cy="24" r="2.2" fill="#4ade80" opacity="0.9" /> <!-- Green/Forest -->

  <!-- Subtle Connecting Mana Constellation Lines -->
  <polygon points="32,12 48,24 43,48 21,48 16,24" fill="none" stroke="#6366f1" stroke-width="0.75" stroke-dasharray="2 1" opacity="0.4" />

  <!-- Center MTG Emblem Lotus / Diamond Crest -->
  <path d="M32 16 L44 32 L32 48 L20 32 Z" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Stylized Serif 'M' with Modern MTG Curves -->
  <path d="M19 45 L19 25 L28 37 L32 37 L36 37 L45 25 L45 45 M17 45 L22 45 M42 45 L47 45 M17 25 L22 25 M42 25 L47 25" 
        stroke="url(#manaSpark)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Golden Crown Spark at Top of M -->
  <polygon points="32,23 34,27 38,27 35,30 36,34 32,31 28,34 29,30 26,27 30,27" fill="url(#goldAccent)" />
</svg>
